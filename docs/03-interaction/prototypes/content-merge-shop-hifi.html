<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容合并与商城 - 高保真稿</title>
  <style>
    :root { --bg:#f6f4ef; --card:#fff; --text:#232323; --muted:#7a7a7a; --brand:#ff6b6b; --line:#ece8df; }
    * { box-sizing:border-box; font-family:"PingFang SC","Noto Sans SC",sans-serif; }
    body { margin:0; background:linear-gradient(160deg,#f8f7f2,#f2eee4); color:var(--text); }
    .phone { max-width:390px; margin:0 auto; min-height:100vh; padding:16px 16px 92px; }
    .title { font-size:28px; font-weight:800; margin:8px 0 4px; }
    .sub { color:var(--muted); font-size:13px; margin:0 0 14px; }
    .section { margin:14px 0; }
    .card { background:var(--card); border-radius:16px; border:1px solid var(--line); padding:12px; box-shadow:0 8px 20px rgba(0,0,0,.03); }
    .row { display:flex; gap:10px; overflow:auto; }
    .mini { min-width:170px; }
    .tag { display:inline-block; font-size:11px; color:#a14; background:#ffe9ec; padding:2px 8px; border-radius:999px; }
    .product { display:flex; gap:10px; margin:10px 0 0; }
    .pic { width:72px; height:72px; border-radius:12px; background:linear-gradient(145deg,#ffd5a8,#ffb4a2); }
    .bottom { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.95); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:10px 0 20px; }
    .bottom span { font-size:12px; color:var(--muted); }
    .active { color:var(--brand) !important; font-weight:700; }
  </style>
</head>
<body>
  <div class="phone">
    <h1 class="title">内容中心</h1>
    <p class="sub">养宠知识 + 领养故事，一站浏览</p>

    <section class="section card">
      <div class="tag">百科精选</div>
      <div class="row" style="margin-top:10px;">
        <div class="mini card">新手养狗必读清单</div>
        <div class="mini card">换季常见皮肤问题</div>
      </div>
    </section>

    <section class="section card">
      <div class="tag">幸福故事</div>
      <div class="row" style="margin-top:10px;">
        <div class="mini card">从流浪到家庭的一年</div>
        <div class="mini card">和豆包一起康复训练</div>
      </div>
    </section>

    <h1 class="title" style="margin-top:20px;">宠物用品商城</h1>
    <p class="sub">按场景挑选，安心到家</p>

    <section class="card">
      <div class="product">
        <div class="pic"></div>
        <div>
          <div style="font-weight:700;">幼犬低敏主粮 2kg</div>
          <div style="color:var(--muted);font-size:12px;">月销 1.2k · 4.8分</div>
          <div style="margin-top:6px;color:#ef4444;font-weight:800;">¥129</div>
        </div>
      </div>
      <div class="product">
        <div class="pic" style="background:linear-gradient(145deg,#d7e8ff,#bed9ff);"></div>
        <div>
          <div style="font-weight:700;">防爆冲胸背牵引套</div>
          <div style="color:var(--muted);font-size:12px;">出行必备 · 4.9分</div>
          <div style="margin-top:6px;color:#ef4444;font-weight:800;">¥89</div>
        </div>
      </div>
    </section>
  </div>

  <nav class="bottom">
    <span>探索</span><span>论坛</span><span class="active" data-ui="tab-content">内容</span><span data-ui="tab-shop">商城</span><span>我的</span>
  </nav>
</body>
</html>
