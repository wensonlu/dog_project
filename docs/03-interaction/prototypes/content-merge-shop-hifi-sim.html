<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容合并与商城 - 状态模拟</title>
  <style>
    :root{--bg:#f6f4ef;--card:#fff;--line:#ece8df;--text:#262626;--muted:#7a7a7a;--brand:#ff6b6b;--ok:#10b981;--err:#ef4444}
    *{box-sizing:border-box;font-family:"PingFang SC","Noto Sans SC",sans-serif}
    body{margin:0;background:radial-gradient(circle at 20% 10%,#fff,#f3eee3)}
    .wrap{max-width:420px;margin:0 auto;padding:14px 14px 110px;min-height:100vh}
    .head{font-size:26px;font-weight:800;margin:8px 0}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
    .chips{display:flex;gap:8px;overflow:auto;margin-bottom:10px}
    .chip{padding:6px 10px;border-radius:999px;background:#fff1f1;font-size:12px;color:#a11}
    .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    button{border:0;border-radius:12px;padding:10px;font-weight:700;background:#ffe7e7;color:#9f1239;cursor:pointer}
    .ghost{background:#f4f4f4;color:#374151}
    .list{display:none}
    .item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f2efe8}
    .pic{width:64px;height:64px;border-radius:10px;background:linear-gradient(145deg,#ffd5a8,#ffb4a2)}
    .skeleton{height:78px;border-radius:12px;background:linear-gradient(90deg,#f3f3f3,#e8e8e8,#f3f3f3);animation:sh 1.1s infinite}
    @keyframes sh{0%{background-position:-120px 0}100%{background-position:120px 0}}
    .err{display:none;color:var(--err);font-size:14px}
    .ok{display:none;color:var(--ok);font-size:14px}
    .log{margin-top:8px;background:#121826;color:#e5edf7;border-radius:12px;padding:10px;min-height:100px;font-size:12px;white-space:pre-line}
    .bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 20px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">宠物用品商城</div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:8px">可切换加载/失败/完成状态</div>

    <div class="panel">
      <div class="chips"><span class="chip">主粮</span><span class="chip">零食</span><span class="chip">清洁</span><span class="chip">出行</span></div>
      <div class="btns">
        <button data-ui="btn-start" id="btnStart">开始执行</button>
        <button data-ui="btn-fail" id="btnFail">失败注入</button>
        <button data-ui="btn-retry" id="btnRetry">重试</button>
        <button data-ui="btn-cancel" id="btnCancel" class="ghost">取消</button>
      </div>

      <div id="loading" style="margin-top:10px">
        <div class="skeleton"></div>
        <div class="skeleton" style="margin-top:8px"></div>
      </div>

      <div class="err" id="error">加载失败，请检查网络后重试。</div>
      <div class="ok" id="done">加载完成，可继续浏览商品。</div>

      <div class="list" id="list">
        <div class="item"><div class="pic"></div><div><b>幼犬低敏主粮 2kg</b><div>¥129 · 4.8分</div></div></div>
        <div class="item"><div class="pic" style="background:linear-gradient(145deg,#d7e8ff,#bed9ff)"></div><div><b>防爆冲胸背牵引套</b><div>¥89 · 4.9分</div></div></div>
      </div>

      <div class="log" data-ui="event-log" id="log">[idle] 等待操作...</div>
    </div>
  </div>

  <nav class="bottom"><span>探索</span><span>论坛</span><span data-ui="tab-content">内容</span><span style="color:var(--brand);font-weight:700" data-ui="tab-shop">商城</span><span>我的</span></nav>

  <script>
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const done = document.getElementById('done');
    const list = document.getElementById('list');
    const log = document.getElementById('log');
    const setState = (s) => {
      loading.style.display = s === 'loading' ? 'block' : 'none';
      error.style.display = s === 'error' ? 'block' : 'none';
      done.style.display = s === 'done' ? 'block' : 'none';
      list.style.display = s === 'done' ? 'block' : 'none';
    };
    const write = (t) => { log.textContent = `${new Date().toLocaleTimeString()} ${t}\n` + log.textContent; };
    document.getElementById('btnStart').onclick = () => { setState('loading'); write('shop.fetch.running'); setTimeout(() => { setState('done'); write('shop.fetch.success'); }, 900); };
    document.getElementById('btnFail').onclick = () => { setState('error'); write('shop.fetch.failed'); };
    document.getElementById('btnRetry').onclick = () => { setState('loading'); write('shop.fetch.retry'); setTimeout(() => { setState('done'); write('shop.fetch.success'); }, 700); };
    document.getElementById('btnCancel').onclick = () => { setState('loading'); write('shop.fetch.cancelled'); };
  </script>
</body>
</html>
