<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9D79"/>
      <stop offset="48%" stop-color="#FF84A6"/>
      <stop offset="100%" stop-color="#6ED6C2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.15" r="0.28">
      <stop offset="0%" stop-color="#FFF6CF"/>
      <stop offset="100%" stop-color="#FFF6CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.18" r="0.25">
      <stop offset="0%" stop-color="#FFD9E8"/>
      <stop offset="100%" stop-color="#FFD9E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow1)"/>
  <rect width="1024" height="1024" fill="url(#glow2)"/>

  <!-- head -->
  <g filter="url(#shadow)">
    <ellipse cx="512" cy="540" rx="310" ry="280" fill="#FFF6EE"/>
    <ellipse cx="330" cy="375" rx="90" ry="115" fill="#FFD8BF" transform="rotate(-20 330 375)"/>
    <ellipse cx="694" cy="375" rx="90" ry="115" fill="#FFD8BF" transform="rotate(20 694 375)"/>
    <ellipse cx="330" cy="388" rx="45" ry="65" fill="#FFC6D1" transform="rotate(-20 330 388)" opacity="0.75"/>
    <ellipse cx="694" cy="388" rx="45" ry="65" fill="#FFC6D1" transform="rotate(20 694 388)" opacity="0.75"/>

    <!-- eyes -->
    <ellipse cx="405" cy="550" rx="44" ry="54" fill="#2D2D3A"/>
    <ellipse cx="619" cy="550" rx="44" ry="54" fill="#2D2D3A"/>
    <circle cx="392" cy="536" r="12" fill="#FFFFFF"/>
    <circle cx="606" cy="536" r="12" fill="#FFFFFF"/>
    <circle cx="423" cy="572" r="6" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="637" cy="572" r="6" fill="#FFFFFF" opacity="0.9"/>

    <!-- blush -->
    <ellipse cx="315" cy="642" rx="52" ry="24" fill="#FFB8CA" opacity="0.75"/>
    <ellipse cx="709" cy="642" rx="52" ry="24" fill="#FFB8CA" opacity="0.75"/>

    <!-- muzzle -->
    <ellipse cx="512" cy="664" rx="120" ry="86" fill="#FFFFFF"/>
    <ellipse cx="512" cy="622" rx="30" ry="22" fill="#31313F"/>
    <path d="M512 640 L512 678" stroke="#31313F" stroke-width="6" stroke-linecap="round"/>
    <path d="M470 680 Q512 728 554 680" fill="none" stroke="#31313F" stroke-width="6" stroke-linecap="round"/>
    <path d="M490 707 Q512 744 534 707" fill="#FF8FA7"/>
  </g>

  <!-- paw -->
  <g filter="url(#shadow)">
    <ellipse cx="512" cy="845" rx="98" ry="72" fill="#FFF6EE"/>
    <ellipse cx="458" cy="780" rx="18" ry="24" fill="#FFF6EE"/>
    <ellipse cx="494" cy="770" rx="18" ry="24" fill="#FFF6EE"/>
    <ellipse cx="530" cy="770" rx="18" ry="24" fill="#FFF6EE"/>
    <ellipse cx="566" cy="780" rx="18" ry="24" fill="#FFF6EE"/>
  </g>

  <text x="512" y="968" text-anchor="middle" fill="rgba(255,255,255,0.95)" font-size="56" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">PAWMATE</text>
</svg>
